name: Publish to TestPyPI

on:
  workflow_dispatch:

jobs:
  testpypi-publish:
    name: Build and publish Python distribution to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/kawi-tts
    permissions:
      id-token: write  # Mandatory for Trusted Publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build binary wheel and source distribution
        run: |
          python -m build

      - name: Check package distribution metadata
        run: |
          twine check dist/*

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verbose: true
