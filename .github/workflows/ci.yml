name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and integration tests (zero dependencies)
        run: |
          python -m unittest discover -s tests

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution metadata
        run: |
          twine check dist/*

      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl

      - name: Test CLI entry point in isolated directory
        run: |
          mkdir -p /tmp/cli_test
          cd /tmp/cli_test
          kawi-trace "om awighnam astu namas sidham"
          kawi-trace "sang-hyang kamahāyānikan"
          python -c "import kawi_tts; print('Installed kawi_tts version:', kawi_tts.__version__)"
